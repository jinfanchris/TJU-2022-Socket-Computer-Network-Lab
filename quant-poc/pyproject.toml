[project]
name = "quantpoc"
version = "0.1.0"
description = "Quantitative-trading POC: one Python engine, a React web client, and a Textual TUI."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "websockets>=12.0",
    "textual>=0.60",
    "rich>=13.0",
]

[project.optional-dependencies]
# Real market data. Not needed for the default synthetic mode.
data = ["yfinance>=0.2.40", "ccxt>=4.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantpoc*", "tui*"]
